<text x="76" y="46" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#e6edf3">Operating Systems: concurrency and cryptography</text>
<text x="76" y="68" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14.5" fill="#9da7b3">Four C projects from the course, no libraries beyond POSIX and libc.</text>
<g transform="translate(28,92)">
<rect width="458" height="92" rx="12" fill="#121826" stroke="#9ec1ff" stroke-opacity=".45"/>
<rect width="5" height="92" rx="2.5" fill="#9ec1ff"/>
<text x="26" y="32" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#9ec1ff">Concurrency labs</text>
<text x="26" y="56" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#aeb7c4">9 labs: dining philosophers, semaphores,</text>
<text x="26" y="75" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#aeb7c4">thread-safe stack, parallel matrix, CPU timing</text></g><g transform="translate(514,92)">
<rect width="458" height="92" rx="12" fill="#121826" stroke="#92dcc0" stroke-opacity=".45"/>
<rect width="5" height="92" rx="2.5" fill="#92dcc0"/>
<text x="26" y="32" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#92dcc0">Garage simulator</text>
<text x="26" y="56" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#aeb7c4">Producer-consumer with a shared queue,</text>
<text x="26" y="75" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#aeb7c4">mutexes and live capacity tracking</text></g><g transform="translate(28,198)">
<rect width="458" height="92" rx="12" fill="#121826" stroke="#c3b1f7" stroke-opacity=".45"/>
<rect width="5" height="92" rx="2.5" fill="#c3b1f7"/>
<text x="26" y="32" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#c3b1f7">LibShell</text>
<text x="26" y="56" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#aeb7c4">A multi-level shell built on fork, exec,</text>
<text x="26" y="75" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#aeb7c4">wait and raw system calls</text></g><g transform="translate(514,198)">
<rect width="458" height="92" rx="12" fill="#121826" stroke="#e6b6e3" stroke-opacity=".45"/>
<rect width="5" height="92" rx="2.5" fill="#e6b6e3"/>
<text x="26" y="32" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#e6b6e3">File encryptor</text>
<text x="26" y="56" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#aeb7c4">ChaCha20 (RFC 8439) and SHA-256 (FIPS 180-4),</text>
<text x="26" y="75" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#aeb7c4">random nonce, constant-time password check</text></g>

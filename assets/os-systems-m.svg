<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 522" role="img" aria-label="Operating Systems in C: concurrency labs, garage simulator, a multi-level shell and a ChaCha20 file encryptor">
<title>Operating Systems in C</title>
<rect x=".5" y=".5" width="499" height="521" rx="14" fill="#0d1117" stroke="#30363d"/>
<rect x="0" y="14" width="5" height="494" rx="2.5" fill="#a9b4f9"/>
<g transform="translate(24,22)" fill="none" stroke="#a9b4f9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="26" height="22" rx="4"/><path d="M8 11l5 4-5 4M16 20h7"/></g>
<text x="72" y="44" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#e6edf3">Operating Systems</text>
<text x="72" y="66" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#9da7b3">Concurrency and cryptography, in C.</text>
<text x="20" y="92" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#9da7b3">Four projects, POSIX and libc only.</text>
<g transform="translate(20,104)">
<rect width="460" height="82" rx="12" fill="#121826" stroke="#9ec1ff" stroke-opacity=".45"/>
<rect width="5" height="82" rx="2.5" fill="#9ec1ff"/>
<text x="22" y="27" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#9ec1ff">Concurrency labs</text>
<text x="22" y="49" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#aeb7c4">9 labs: dining philosophers, semaphores,</text>
<text x="22" y="67" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#aeb7c4">thread-safe stack, parallel matrix, CPU timing</text></g><g transform="translate(20,196)">
<rect width="460" height="82" rx="12" fill="#121826" stroke="#92dcc0" stroke-opacity=".45"/>
<rect width="5" height="82" rx="2.5" fill="#92dcc0"/>
<text x="22" y="27" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#92dcc0">Garage simulator</text>
<text x="22" y="49" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#aeb7c4">Producer-consumer with a shared queue,</text>
<text x="22" y="67" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#aeb7c4">mutexes and live capacity tracking</text></g><g transform="translate(20,288)">
<rect width="460" height="82" rx="12" fill="#121826" stroke="#c3b1f7" stroke-opacity=".45"/>
<rect width="5" height="82" rx="2.5" fill="#c3b1f7"/>
<text x="22" y="27" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#c3b1f7">LibShell</text>
<text x="22" y="49" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#aeb7c4">A multi-level shell built on fork, exec,</text>
<text x="22" y="67" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#aeb7c4">wait and raw system calls</text></g><g transform="translate(20,380)">
<rect width="460" height="82" rx="12" fill="#121826" stroke="#e6b6e3" stroke-opacity=".45"/>
<rect width="5" height="82" rx="2.5" fill="#e6b6e3"/>
<text x="22" y="27" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e6b6e3">File encryptor</text>
<text x="22" y="49" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#aeb7c4">ChaCha20 (RFC 8439) and SHA-256 (FIPS 180-4),</text>
<text x="22" y="67" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" fill="#aeb7c4">random nonce, constant-time password check</text></g>

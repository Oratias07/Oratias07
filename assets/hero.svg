<text x="64" y="134" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#8b949e">Software Engineering student  ·  3rd year</text>
<text x="64" y="176" font-family="ui-monospace,'SFMono-Regular',Consolas,Menlo,monospace" font-size="26" fill="#9ec1ff" opacity="1"><tspan>&gt; Systems programming in C</tspan><animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0.000;0.313;0.333;1.000" values="1;1;0;0"/></text><text x="64" y="176" font-family="ui-monospace,'SFMono-Regular',Consolas,Menlo,monospace" font-size="26" fill="#92dcc0" opacity="0"><tspan>&gt; AI systems you can trust</tspan><animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0.000;0.333;0.353;0.647;0.667;1.000" values="0;0;1;1;0;0"/></text><text x="64" y="176" font-family="ui-monospace,'SFMono-Regular',Consolas,Menlo,monospace" font-size="26" fill="#c3b1f7" opacity="0"><tspan>&gt; Security-minded engineering</tspan><animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0.000;0.667;0.687;0.980;1.000" values="0;0;1;1;0"/></text>
<text x="64" y="222" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#6e7681">C  ·  Python  ·  TypeScript  ·  LLM systems  ·  Security</text>
